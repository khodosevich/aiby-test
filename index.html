<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>aiby-test</title>
	<link rel="stylesheet" href="src/styles/style.css">
</head>
<body>

<div class="app">
	<main class="banner">
		<div class="banner__container">
			<div class="banner__cross">
				<a class="banner__close" href="#">
					<img src="assets/cross.svg" alt="cross">
				</a>
			</div>
			<div class="banner__content">
				<h1 class="banner__title" data-i18n="title">Get Unlimited Access</h1>
				<div class="banner__cards">
					<div class="banner__card banner__card_first">
						<h4 class="banner__card-title" data-i18n="title-card-first">
							Unlimited Art Creation
						</h4>
					</div>
					<div class="banner__card banner__card_second">
						<h4 class="banner__card-title" data-i18n="title-card-second">
							Exclusive <br>Styles
						</h4>
					</div>
					<div class="banner__card banner__card_third">
						<h4 class="banner__card-title" data-i18n="title-card-third">
							Magic Avatars <br>With 20% Off
						</h4>
					</div>
				</div>
				<div class="banner__buttons">
					<a href="#" class="banner__button banner__btn-switch" role="button">
						<div class="banner__button-content">
							<div class="banner__best-label" data-i18n="best-offer">
								best offer
							</div>
							<div class="banner__info">
								<span class="banner__info-text" data-i18n="yearly-access">Yearly access</span>
								<br> <span class="banner__info-yearly" data-i18n="price-year">
									Just $39.99 per year
								</span>
							</div>
							<div class="banner__price" data-i18n="price-week">
								$0.48<br>
								per week
							</div>
						</div>
					</a>

					<a href="#" class="banner__button banner__btn-switch" role="button">
						<div class="banner__button-content">
							<div class="banner__info">
								<span class="banner__info-text" data-i18n="weekly-access">Weekly access</span>
							</div>
							<div class="banner__price" data-i18n="weekly-price-week">
								$6.99<br>
								per week
							</div>
						</div>
					</a>

					<a href="https://apple.com/" target="_blank" class="banner__button banner__button_continue"
					   role="button" id="continue-btn">
						<div class="banner__button-continue">
							Continue
						</div>
					</a>
				</div>
			</div>
		</div>
	</main>
	<footer class="footer">
		<div class="footer__links">
			<a class="footer__link" href="#">Terms of Use</a>
			<a class="footer__link" href="#">Privacy Policy</a>
			<a class="footer__link" href="#">Restore</a>
		</div>
	</footer>
</div>

<script src="src/scripts/index.js" type="module"></script>
</body>
</html>
